<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>？？？｜東洋工作所</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#12324a;color:#fff;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
body{background:linear-gradient(#1c4d73,#0f2a3f);padding:0 0 40px}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,#ffd447 0 14px,#2a2a2a 14px 28px)}
.wrap{max-width:460px;margin:0 auto;padding:14px 16px}
h1{margin:10px 0 2px;text-align:center;font-size:26px;color:#ffd447;text-shadow:0 3px 0 #0a1c2b}
.sub{text-align:center;font-size:13px;color:#cfe6f3;margin-bottom:12px;line-height:1.6}
.card{background:#fff;color:#173044;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 4px 0 #0a1c2b}
.q{font-weight:900;font-size:17px;margin:0 0 10px}
.q i{display:inline-block;background:#ff8a1f;color:#fff;border-radius:50%;width:26px;height:26px;line-height:26px;text-align:center;font-style:normal;margin-right:6px;font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.o{flex:1 1 calc(50% - 8px);min-width:130px;border:3px solid #9fc4dc;background:#eef7fc;color:#173044;border-radius:12px;padding:12px 8px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;text-align:center}
.o.on{border-color:#ff8a1f;background:#fff1de;box-shadow:0 0 0 2px #ff8a1f inset}
.o.w{flex-basis:100%}
textarea{width:100%;height:84px;border:3px solid #9fc4dc;border-radius:12px;padding:10px;font:inherit;font-size:16px;resize:none;color:#173044}
.hint{font-size:12px;color:#5a7385;margin-top:6px}
.send{display:block;width:100%;border:0;border-radius:16px;background:#2fbf6b;color:#fff;font:inherit;font-weight:900;font-size:20px;padding:16px;box-shadow:0 5px 0 #17803f;cursor:pointer;margin-top:6px}
.send:disabled{background:#8aa;box-shadow:0 5px 0 #567;cursor:default}
.msg{text-align:center;font-weight:800;margin:10px 0;min-height:22px;color:#ffd447}
.err{color:#ff9a8a}
.step{display:none}.step.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center}
.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:800;background:#2b6a96;border-radius:10px;padding:8px 12px}
.foot{text-align:center;font-size:11px;color:#8fb0c4;margin-top:18px;line-height:1.6}
/* drawing */
.board{position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;border:4px solid #173044;background:
 conic-gradient(#f4f8fb 25%,#e3edf3 0 50%,#f4f8fb 0 75%,#e3edf3 0) 0 0/28px 28px}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #173044;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 4px #ff8a1f}
.tb{border:0;border-radius:10px;background:#2b6a96;color:#fff;font:inherit;font-weight:800;font-size:14px;padding:9px 12px;cursor:pointer}
.tb.on{background:#ff8a1f}
.sz{display:flex;gap:6px}
.big{display:block;width:100%;border:0;border-radius:16px;background:#ff8a1f;color:#fff;font:inherit;font-weight:900;font-size:20px;padding:16px;box-shadow:0 5px 0 #b35a0c;cursor:pointer;margin-top:8px;text-align:center;text-decoration:none}
.big.g{background:#2fbf6b;box-shadow:0 5px 0 #17803f}
.pv{display:flex;justify-content:center;gap:10px;margin:10px 0}
.pv canvas{background:#e3edf3;border-radius:10px}
.cen{text-align:center}
.cen h2{font-size:26px;color:#ffd447;margin:14px 0 6px}
.cen p{font-size:15px;line-height:1.7}
</style></head><body>
<div class="stripe"></div>
<div class="wrap">
 <div class="top"><a href="toyo_menu.html">◀ ゲームえらびへ</a></div>

 <!-- LOCK -->
 <div class="step cen" id="s0">
  <h1>❓ ？？？</h1>
  <p class="sub" style="font-size:18px;line-height:2.1"><ruby>特設<rt>とくせつ</rt></ruby>ホームページの<br><b style="color:#ffd447">アンケートに<ruby>答<rt>こた</rt></ruby>えると…</b><br><ruby>何<rt>なに</rt></ruby>かが<ruby>起<rt>お</rt></ruby>きる！？</p>
  <div class="foot">株式会社東洋工作所<br>パイプでワクワクをつなぎ未来をソウゾウする</div>
 </div>

 <!-- STEP 2: キャラをかく -->
 <div class="step" id="s2">
  <h1>🎨 じぶんキャラを<ruby>描<rt>か</rt></ruby>こう！</h1>
  <div class="sub">アンケートありがとう！<br><b style="color:#ffd447;font-size:17px"><ruby>好<rt>す</rt></ruby>きな<ruby>絵<rt>え</rt></ruby>を<ruby>描<rt>か</rt></ruby>いてね！</b><br>（<ruby>丸<rt>まる</rt></ruby>ひとつでも<ruby>動<rt>うご</rt></ruby>くよ）</div>
  <div class="board"><canvas id="cv" width="360" height="360"></canvas></div>
  <div class="tools" id="cols"></div>
  <div class="tools">
   <div class="sz"><button class="tb on" data-s="5">ほそい</button><button class="tb" data-s="11">ふつう</button><button class="tb" data-s="22">ふとい</button></div>
   <button class="tb" id="er">けしゴム</button><button class="tb" id="un">↩ もどす</button><button class="tb" id="cl">ぜんぶけす</button>
  </div>
  <div class="pv" id="pv"></div>
  <div class="msg" id="msg2"></div>
  <button class="big g" id="fin">✅ できた！ はしらせる</button>
 </div>

 <!-- STEP 3: できた -->
 <div class="step cen" id="s3">
  <h2>できた！🎉</h2>
  <p>きみの キャラが TOYODASHに とうじょうするよ！<br>「キャラえらび」で <b>「じぶん」</b>を えらんでね。</p>
  <div class="pv" id="pv2"></div>
  <a class="big" href="toyo_action.html">🏃 TOYODASHで はしる！</a>
  <button class="big g" id="redo">🎨 かきなおす</button>
  <div class="foot">株式会社東洋工作所<br>パイプでワクワクをつなぎ未来をソウゾウする</div>
 </div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const show=n=>{document.querySelectorAll('.step').forEach(e=>e.classList.toggle('on',e.id===n));window.scrollTo(0,0)};
/* ---- gate: とくせつHPのアンケートに こたえた人だけ ---- */
let okFlag=false;try{const q=new URLSearchParams(location.search);if(q.get('ok')==='1')localStorage.setItem('toyo_survey_ok','1');okFlag=localStorage.getItem('toyo_survey_ok')==='1'||localStorage.getItem('toyo_enq_done')==='1'}catch(e){okFlag=/[?&]ok=1/.test(location.search)}
/* ---- drawing ---- */
const cv=$('cv'),cx=cv.getContext('2d');cx.lineCap='round';cx.lineJoin='round';
const COLS=['#173044','#e84f4f','#ff8a1f','#ffd447','#2fbf6b','#2b9fd9','#7a4fd1','#ff7ab0','#8b5a2b','#ffffff'];
let col=COLS[0],size=11,eraser=false,drawing=false,last=null;const hist=[];
COLS.forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(i===0?' on':'');b.style.background=c;b.setAttribute('aria-label','いろ');b.onclick=()=>{col=c;eraser=false;$('er').classList.remove('on');document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on')};$('cols').appendChild(b)});
document.querySelectorAll('.tb[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;document.querySelectorAll('.tb[data-s]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
$('er').onclick=()=>{eraser=!eraser;$('er').classList.toggle('on',eraser)};
function snap(){try{hist.push(cx.getImageData(0,0,cv.width,cv.height));if(hist.length>25)hist.shift()}catch(e){}}
$('un').onclick=()=>{const h=hist.pop();if(h){cx.putImageData(h,0,0);preview()}};
$('cl').onclick=()=>{snap();cx.clearRect(0,0,cv.width,cv.height);preview()};
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
function stroke(a,b){cx.globalCompositeOperation=eraser?'destination-out':'source-over';cx.strokeStyle=col;cx.lineWidth=size*(cv.width/360);cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);snap();drawing=true;last=pos(e);const p=[last[0]+.01,last[1]];stroke(last,p)});
cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e);stroke(last,p);last=p});
const end=()=>{if(drawing){drawing=false;preview()}};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
/* ---- variants ---- */
function bbox(c){const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>24){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}return x1<0?null:[x0,y0,x1+1,y1+1]}
function tight(c){const b=bbox(c);if(!b)return null;const o=document.createElement('canvas');o.width=b[2]-b[0];o.height=b[3]-b[1];o.getContext('2d').drawImage(c,b[0],b[1],o.width,o.height,0,0,o.width,o.height);return o}
function variant(B,rot,sx,sy){ // pivot = bottom center
 const P=Math.ceil(Math.max(B.width,B.height)*1.5),c=document.createElement('canvas');c.width=P*2;c.height=P*2;const t=c.getContext('2d');t.imageSmoothingQuality='high';
 t.translate(P,P*1.5);t.rotate(rot);t.scale(sx,sy);t.drawImage(B,-B.width/2,-B.height);
 return tight(c)}
function url(c){return{u:c.toDataURL('image/png'),w:c.width,h:c.height}}
function build(){const t=tight(cv);if(!t)return null;const s=Math.min(170/t.height,230/t.width);
 const B=document.createElement('canvas');B.width=Math.max(8,Math.round(t.width*s));B.height=Math.max(8,Math.round(t.height*s));const g=B.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(t,0,0,B.width,B.height);
 const R=d=>d*Math.PI/180;
 return{stand:variant(B,0,1,1),run1:variant(B,R(-7),1.02,.97),run2:variant(B,R(7),.98,1.03),jump:variant(B,R(-3),.93,1.1),hurt:variant(B,R(-88),1,1),cheer:variant(B,R(5),1.04,1.04)}}
function preview(){const v=build(),box=$('pv');box.innerHTML='';if(!v)return;for(const k of['stand','run1','run2','jump']){const c=document.createElement('canvas');c.width=64;c.height=72;const t=c.getContext('2d'),s=Math.min(58/v[k].width,66/v[k].height);t.drawImage(v[k],(64-v[k].width*s)/2,72-4-v[k].height*s,v[k].width*s,v[k].height*s);box.appendChild(c)}}
$('fin').onclick=()=>{const v=build();if(!v){$('msg2').className='msg err';$('msg2').textContent='なにか かいてね！';return}
 const o={};for(const k in v)o[k]=url(v[k]);
 try{localStorage.setItem('toyo_mychar',JSON.stringify(o))}catch(e){$('msg2').className='msg err';$('msg2').textContent='ほぞんできなかったよ。もっと シンプルに かいてね';return}
 const pv=$('pv2');pv.innerHTML='';for(const k of['stand','run1','run2']){const c=document.createElement('canvas');c.width=84;c.height=96;const t=c.getContext('2d'),s=Math.min(78/v[k].width,88/v[k].height);t.drawImage(v[k],(84-v[k].width*s)/2,96-4-v[k].height*s,v[k].width*s,v[k].height*s);pv.appendChild(c)}
 show('s3')};
$('redo').onclick=()=>{show('s2')};
show(okFlag?'s2':'s0');
})();
</script></body></html>
